name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-ci:
    name: Backend CI (Python)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: "pip"
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Check Python syntax
      # Compila los archivos para asegurar que no hay errores de sintaxis
      run: |
        python -m py_compile backend.py main.py
        python -m py_compile dora_metrics/*.py
        python -m py_compile dora_metrics/tools/*.py

  frontend-ci:
    name: Frontend CI (Node.js)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: "18"
        cache: "npm"
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install Node.js dependencies
      working-directory: ./frontend
      run: npm ci
      
    - name: Run Linter
      working-directory: ./frontend
      run: npm run lint
      
    - name: Build Application
      working-directory: ./frontend
      run: npm run build
